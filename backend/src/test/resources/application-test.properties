# Tests use their own database (create "ticket_booking_test" in pgAdmin; it is wiped by the tests).
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/ticket_booking_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Also create Conveyor's tables, so tests can see the background tasks the app adds.
spring.flyway.locations=classpath:db/migration,classpath:db/test-migration

jwt.secret=test-secret-that-is-long-enough-for-hmac-sha-256-signing
app.admin-emails=admin@test.local
app.booking.hold-duration=PT3S
app.tasks.secret=test-task-secret
app.mail.mode=outbox
app.mail.outbox-dir=target/test-outbox
