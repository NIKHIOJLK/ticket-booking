spring.application.name=ticket-booking

# Secrets and machine-specific settings live in backend/.env (copy .env.example).
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------- database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticket_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway applies db/migration/V*.sql in order. baseline-version=0 means that on a
# database created by hand earlier, V1 still runs (it only creates missing tables).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ---------------------------------------------------------------- auth
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
# Accounts with these emails become admins (can create events and check people in)
app.admin-emails=${ADMIN_EMAILS:}

# ---------------------------------------------------------------- booking rules
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.booking.hold-duration=${HOLD_DURATION:PT10M}
app.booking.max-seats-per-user=6
app.booking.cancel-cutoff=PT2H
app.booking.reminder-before=PT2H

# ---------------------------------------------------------------- background tasks (Conveyor)
# Conveyor's HTTP worker calls /internal/tasks/{name} with this shared secret.
app.tasks.secret=${TASKS_SECRET:}

# ---------------------------------------------------------------- email
# outbox = save each email (and its PDF) as files in backend/outbox/ instead of sending
# smtp   = really send, e.g. through Gmail with an app password
app.mail.mode=${MAIL_MODE:outbox}
app.mail.from=${MAIL_FROM:Ticket Booking <no-reply@ticketbooking.local>}
app.mail.outbox-dir=${MAIL_OUTBOX_DIR:outbox}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
